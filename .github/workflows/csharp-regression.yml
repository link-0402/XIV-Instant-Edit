name: C# Regression Suites

# Runs the console regression suites under Tests/. Each suite prints [PASS] and [FAIL] lines,
# keeps going after a failure, ends with a summary and exits non-zero when any check failed.
#
# Every suite compiles Dalamud-Plugin/InstantEdit.csproj, and the plugin cannot compile without
# Dalamud's development assemblies (Dalamud, the ImGui bindings, FFXIVClientStructs, Lumina and
# Newtonsoft.Json), so no suite runs without them. ExportContextRegression only lacks a direct
# reference to Dalamud.dll. The job therefore downloads Dalamud's distribution into the folder the
# project files look in. It does not need the game, XIVLauncher or Penumbra:
#
# - ExportContextRegression: runs. The physics checks against vanilla files print [SKIP], because
#   no game install is found through XIVLauncher's config.
# - BlenderStatusRegression: runs. Blender is stubbed; the Dalamud log is a stand-in proxy.
# - AnimationRegression: runs. Native and in-game acceptance stays a manual step inside FFXIV.
# - ChangelogRegression: runs.
#
# Builds are Debug: a Release build of the plugin is what Dalamud hot-reloads on a dev machine.

on:
  push:
    branches:
      - main
      - testing
    paths:
      - 'Dalamud-Plugin/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'Blender-Addon/blender_manifest.toml'
      - 'Blender-Addon/instant_edit/**'
      - '.github/workflows/csharp-regression.yml'
  pull_request:
    paths:
      - 'Dalamud-Plugin/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'Blender-Addon/blender_manifest.toml'
      - 'Blender-Addon/instant_edit/**'
      - '.github/workflows/csharp-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The release channel; use https://goatcorp.github.io/dalamud-distrib/stg/latest.zip for staging.
  DALAMUD_DISTRIB: https://goatcorp.github.io/dalamud-distrib/latest.zip

jobs:
  test:
    # The plugin and the suites target net10.0-windows.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud's development assemblies
        shell: pwsh
        run: |
          $hooks = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force $hooks | Out-Null
          Invoke-WebRequest -Uri $env:DALAMUD_DISTRIB -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $hooks
          foreach ($dll in 'Dalamud', 'Dalamud.Bindings.ImGui', 'FFXIVClientStructs', 'Lumina', 'Newtonsoft.Json') {
            if (-not (Test-Path (Join-Path $hooks "$dll.dll"))) { throw "$dll.dll is missing from $env:DALAMUD_DISTRIB" }
          }
          (Get-Item (Join-Path $hooks 'Dalamud.dll')).VersionInfo.ProductVersion

      - name: Build the plugin
        id: build
        run: dotnet build Dalamud-Plugin/InstantEdit.csproj -c Debug

      # Each suite runs even when an earlier one failed, so one run reports every failure.
      - name: Run export-context regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project Tests/ExportContextRegression -c Debug

      - name: Run Blender status and texture regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project Tests/BlenderStatusRegression -c Debug

      - name: Run animation regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project Tests/AnimationRegression -c Debug

      - name: Run changelog regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project Tests/ChangelogRegression -c Debug
